<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>identifAI-it</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<script type="module" src="js/main.js"></script>
</head>
<body data-pagina="juego">
<main id="app" data-pantalla="portada" data-modo="medio">

  <!-- Portada -->
  <section class="pantalla" id="pantalla-portada" hidden>
    <div class="cinta-peligro" aria-hidden="true"></div>
    <header class="portada-cabecera">
      <h1 tabindex="-1" data-texto="portada.titulo">[[portada.titulo]]</h1>
      <p class="portada-lema" data-texto="portada.lema">[[portada.lema]]</p>
      <p id="portada-caso"></p>
    </header>
    <fieldset id="portada-modos">
      <legend data-texto="portada.elige_modo">[[portada.elige_modo]]</legend>
      <div class="fichas">
        <div class="ficha">
          <input type="radio" name="modo" id="modo-facil" value="facil">
          <label for="modo-facil">
            <span class="ficha-nombre" data-texto="portada.modo_facil">[[portada.modo_facil]]</span>
            <span class="ficha-desc" data-texto="portada.desc_facil">[[portada.desc_facil]]</span>
          </label>
        </div>
        <div class="ficha">
          <input type="radio" name="modo" id="modo-medio" value="medio">
          <label for="modo-medio">
            <span class="ficha-nombre" data-texto="portada.modo_medio">[[portada.modo_medio]]</span>
            <span class="ficha-desc" data-texto="portada.desc_medio">[[portada.desc_medio]]</span>
          </label>
        </div>
        <div class="ficha">
          <input type="radio" name="modo" id="modo-dificil" value="dificil">
          <label for="modo-dificil">
            <span class="ficha-nombre" data-texto="portada.modo_dificil">[[portada.modo_dificil]]</span>
            <span class="ficha-desc" data-texto="portada.desc_dificil">[[portada.desc_dificil]]</span>
          </label>
        </div>
      </div>
    </fieldset>
    <p id="portada-racha" hidden></p>
    <div class="acciones">
      <button type="button" class="boton boton-primario" data-accion="empezar" data-foco data-texto="portada.boton_empezar">[[portada.boton_empezar]]</button>
      <button type="button" class="boton boton-secundario" data-accion="como-jugar" data-texto="portada.boton_como_jugar">[[portada.boton_como_jugar]]</button>
    </div>
    <footer id="portada-pie">
      <a id="portada-creditos" href="creditos.html" data-texto="portada.enlace_creditos">[[portada.enlace_creditos]]</a>
    </footer>
  </section>

  <!-- Como jugar -->
  <section class="pantalla" id="pantalla-como-jugar" hidden>
    <div class="tarjeta">
      <h2 tabindex="-1" data-texto="como_jugar.titulo">[[como_jugar.titulo]]</h2>
      <ol id="como-jugar-pasos"></ol>
    </div>
    <div class="acciones">
      <button type="button" class="boton boton-primario" data-accion="entendido" data-texto="como_jugar.boton_entendido">[[como_jugar.boton_entendido]]</button>
    </div>
  </section>

  <!-- Cargando -->
  <section class="pantalla" id="pantalla-cargando" hidden>
    <div class="centrado">
      <div class="lupa-giro" aria-hidden="true"></div>
      <p role="status" tabindex="-1" data-foco data-texto="cargando.texto">[[cargando.texto]]</p>
    </div>
  </section>

  <!-- Cuenta atras -->
  <section class="pantalla" id="pantalla-cuenta-atras" hidden>
    <div class="centrado">
      <p tabindex="-1" data-foco data-texto="cuenta_atras.aviso">[[cuenta_atras.aviso]]</p>
      <p id="cuenta-atras-numero" aria-live="assertive"></p>
    </div>
  </section>

  <!-- Caso -->
  <section class="pantalla" id="pantalla-caso" data-fase="pregunta" hidden>
    <header id="caso-cabecera">
      <p id="caso-etiqueta" tabindex="-1" data-foco></p>
      <p id="caso-marcador"></p>
    </header>
    <div id="caso-escena">
      <figure id="prueba-marco"></figure>
      <div id="veredicto" role="status" aria-live="polite" hidden>
        <p id="veredicto-sello"></p>
        <div id="veredicto-pie">
          <span id="veredicto-icono" aria-hidden="true"></span>
          <p id="veredicto-texto"></p>
        </div>
      </div>
    </div>
    <div id="temporizador" data-nivel="normal" aria-hidden="true">
      <div id="temporizador-cinta"></div>
    </div>
    <p id="temporizador-anuncio" class="solo-lectores" aria-live="polite"></p>
    <div id="caso-botones">
      <button type="button" class="boton boton-voto" data-voto="autentica" aria-keyshortcuts="R">
        <span class="boton-texto" data-texto="partida.boton_autentica">[[partida.boton_autentica]]</span>
        <kbd aria-hidden="true">R</kbd>
      </button>
      <button type="button" class="boton boton-voto" data-voto="generada" aria-keyshortcuts="I">
        <span class="boton-texto" data-texto="partida.boton_generada">[[partida.boton_generada]]</span>
        <kbd aria-hidden="true">I</kbd>
      </button>
      <button type="button" class="boton boton-primario" data-accion="siguiente" data-texto="partida.boton_siguiente">[[partida.boton_siguiente]]</button>
    </div>
  </section>

  <!-- Resultado -->
  <section class="pantalla" id="pantalla-resultado" hidden>
    <div class="cinta-peligro" aria-hidden="true"></div>
    <div class="tarjeta">
      <p id="resultado-aciertos" tabindex="-1" data-foco></p>
      <p id="resultado-mensaje"></p>
      <p id="resultado-cuadros" role="img"></p>
      <p id="resultado-racha"></p>
      <p id="resultado-mejor-racha"></p>
    </div>
    <ol id="resultado-revision"></ol>
    <div class="acciones">
      <button type="button" class="boton boton-primario" data-accion="compartir" data-texto="compartir.boton">[[compartir.boton]]</button>
    </div>
  </section>

  <!-- Ya jugado -->
  <section class="pantalla" id="pantalla-ya-jugado" hidden>
    <div class="tarjeta">
      <h2 tabindex="-1" data-texto="ya_jugado.titulo">[[ya_jugado.titulo]]</h2>
      <p id="ya-jugado-texto" data-texto="ya_jugado.texto">[[ya_jugado.texto]]</p>
      <p id="ya-jugado-aciertos"></p>
      <p id="ya-jugado-modo"></p>
      <p id="ya-jugado-cuadros" role="img"></p>
      <p id="ya-jugado-racha"></p>
      <p id="ya-jugado-cuenta-atras" aria-live="off"></p>
    </div>
    <div class="acciones">
      <button type="button" class="boton boton-primario" data-accion="compartir" data-texto="compartir.boton">[[compartir.boton]]</button>
    </div>
  </section>

  <!-- Sin casos -->
  <section class="pantalla" id="pantalla-sin-casos" hidden>
    <div class="centrado">
      <div class="huella-fondo" aria-hidden="true"></div>
      <p tabindex="-1" data-foco data-texto="sin_casos.texto">[[sin_casos.texto]]</p>
    </div>
  </section>

  <!-- Error -->
  <section class="pantalla" id="pantalla-error" hidden>
    <div class="centrado">
      <p id="error-texto" role="alert" tabindex="-1" data-foco></p>
      <div class="acciones">
        <button type="button" class="boton boton-primario" data-accion="reintentar" data-texto="errores.boton_reintentar">[[errores.boton_reintentar]]</button>
      </div>
    </div>
  </section>

  <!-- Elementos comunes -->
  <p id="compartir-aviso" aria-live="polite" data-visible="no"></p>
  <textarea id="compartir-manual" rows="5" readonly hidden></textarea>
  <label for="compartir-manual" class="solo-lectores" data-texto="compartir.manual">[[compartir.manual]]</label>
  <p id="aviso-almacen" role="status" hidden data-texto="avisos.sin_guardar">[[avisos.sin_guardar]]</p>

</main>
<noscript>identifAI-it necesita JavaScript para funcionar. Actívalo en tu navegador para examinar las pruebas del día.</noscript>
</body>
</html>
